*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{

header{

header p{margin:8px 0}
.container{max-width:950px;margin:auto;padding:14px}
.box,.card{

}
.levels,.types{

button{

.filter{background:#e8eaf6;color:#283593}
.filter.active{background:#283593;color:white}
.search{

}
.progressbar{
 height:12px;background:#ddd;border-radius:20px;overflow:hidden
}
#progress{height:100%;width:0;background:#2e7d32}
.chapter{
 background:linear-gradient(135deg,#283593,#5c6bc0);
 color:white;padding:17px;border-radius:16px;margin:22px 0 12px
}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{background:#b71c1c;color:white;padding:6px 12px;border-radius:20px}
.type{background:#eee;padding:5px 10px;border-radius:15px;font-size:12px}
.word{text-align:center;font-size:40px;font-weight:800;margin:18px 0 4px}
.reading{text-align:center;font-size:20px;color:#1565c0;font-weight:bold}
.meaning{
 margin-top:15px;background:#fff8e1;padding:13px;border-radius:10px;

}
.example,.grammar{

 padding:14px;border-radius:8px;line-height:1.8
}
.hira{color:#1565c0;margin-top:6px}
.np{color:#5d4037;margin-top:6px}
.speak{width:100%;margin-top:9px;background:#00897b;color:white}
.learn{width:100%;margin-top:9px;background:#e8f5e9;color:#236c32}
.learn.done{background:#2e7d32;color:white}
.quiz{width:100%;background:#7b1fa2;color:white;margin-top:10px}
#quizBox{
 display:none;background:#f8efff;padding:18px;border-radius:14px;
 margin-top:12px;text-align:center
}
.option{width:100%;margin-top:7px;background:white;border:1px solid #bbb}
footer{background:#202124;color:white;text-align:center;padding:28px;margin-top:30px}

 .levels,.types{grid-template-columns:repeat(2,1fr)}

</style>
</head>

<header>
<h1>🇯🇵 日本語 PRACTICE BOOK</h1>
<p>JLPT N5 → N4 → N3</p>
<p>漢字・語彙・文法・例文 × नेपाली</p>
</header>

<main class="container">

<section class="box">
<h2>📚 JLPT Japanese–Nepali Study Book</h2>

<div class="levels">
<button class="filter active" onclick="setLevel('ALL',this)">ALL</button>
<button class="filter" onclick="setLevel('N5',this)">N5</button>
<button class="filter" onclick="setLevel('N4',this)">N4</button>
<button class="filter" onclick="setLevel('N3',this)">N3</button>
</div>

<div class="types">
<button class="filter active typeBtn" onclick="setType('ALL',this)">सबै</button>
<button class="filter typeBtn" onclick="setType('語彙',this)">語彙 Vocabulary</button>
<button class="filter typeBtn" onclick="setType('漢字',this)">漢字 Kanji</button>
<button class="filter typeBtn" onclick="setType('文法',this)">文法 Grammar</button>
</div>

<input id="search" class="search"
placeholder="🔎 日本語・ひらがな・नेपाली Search"
oninput="render()">

<p id="count"></p>
<p id="progressText">✅ 覚えた：0</p>
<div class="progressbar"><div id="progress"></div></div>

<button class="quiz" onclick="startQuiz()">🎯 ランダム練習クイズ</button>
<div id="quizBox"></div>
</section>

<div id="book"></div>
</main>

<footer>
<strong>🇯🇵 JLPT N5–N3 PRACTICE BOOK</strong><br>
Japanese × Hiragana × नेपाली<br>

/* ==================== APP ==================== */

let level="ALL", type="ALL";
let learned=JSON.parse(localStorage.getItem("jlptBookLearned")||"[]");

function speak(t){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang="ja-JP";u.rate=.75;
 const vs=speechSynthesis.getVoices();
 const jp=vs.find(v=>v.lang.startsWith("ja"));
 if(jp)u.voice=jp;
 speechSynthesis.speak(u);
}

function setLevel(v,b){
 level=v;
 b.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");render();
}

function setType(v,b){
 type=v;
 document.querySelectorAll(".typeBtn").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");render();
}

function filtered(){
 const s=document.getElementById("search").value.toLowerCase().trim();
 return data.map((x,i)=>({x,i})).filter(o=>{
  const x=o.x;
  return (level==="ALL"||x[0]===level) &&
         (type==="ALL"||x[1]===type) &&
         x.join(" ").toLowerCase().includes(s);
 });
}

function render(){
 const list=filtered();
 document.getElementById("count").textContent="📖 表示中："+list.length+" 項目";
 const book=document.getElementById("book");
 book.innerHTML="";

 let last="";
 list.forEach(({x,i})=>{
  const key=x[0]+" "+x[1];
  if(key!==last){
   const ch=document.createElement("div");
   ch.className="chapter";
   ch.innerHTML="<strong>📘 "+x[0]+" — "+x[1]+"</strong>";
   book.appendChild(ch);last=key;
  }

  const done=learned.includes(i);
  const c=document.createElement("article");
  c.className="card";
  c.innerHTML=`
   <div class="top">
    <span class="badge">${x[0]}</span>
    <span class="type">${x[1]}</span>
   </div>

   <div class="word">${x[2]}</div>
   <div class="reading">🔤 ${x[3]}</div>

   <div class="meaning">
    🇳🇵 <b>नेपाली अर्थ:</b> ${x[4]}
   </div>

   <button class="speak" onclick='speak(${JSON.stringify(x[2])})'>
    🔊 単語・文法を聞く
   </button>

   <div class="example">
    <b>📝 例文</b><br>
    ${x[5]}
    <div class="hira">🔤 ${x[6]}</div>
    <div class="np">🇳🇵 ${x[7]}</div>
   </div>

   <button class="speak" onclick='speak(${JSON.stringify(x[5])})'>
    🔊 例文を聞く
   </button>

   <button class="learn ${done?"done":""}" onclick="toggleLearn(${i},this)">
    ${done?"✅ 覚えました（याद भयो）":"☐ 覚えた（याद भयो）"}
   </button>
  `;
  book.appendChild(c);
 });
 updateProgress();
}

function toggleLearn(i,b){
 if(learned.includes(i)) learned=learned.filter(n=>n!==i);
 else learned.push(i);
 localStorage.setItem("jlptBookLearned",JSON.stringify(learned));
 render();
}

function updateProgress(){
 document.getElementById("progressText").textContent=
 "✅ 覚えた："+learned.length+" / "+data.length;
 document.getElementById("progress").style.width=
 (learned.length/data.length*100)+"%";
}

function startQuiz(){
 const pool=filtered();
 if(pool.length<4){alert("クイズには4つ以上必要です。");return}
 const correct=pool[Math.floor(Math.random()*pool.length)];
 const others=pool.filter(o=>o.i!==correct.i).sort(()=>Math.random()-.5).slice(0,3);
 const opts=[correct,...others].sort(()=>Math.random()-.5);
 const q=document.getElementById("quizBox");
 q.style.display="block";
 q.innerHTML=`
  <h3>🎯 この言葉の意味は？</h3>
  <div class="word">${correct.x[2]}</div>
  <div class="reading">${correct.x[3]}</div>
  ${opts.map(o=>`<button class="option"
  onclick="checkQuiz(${o.i},${correct.i})">${o.x[4]}</button>`).join("")}
  <div id="quizResult"></div>
 `;
}

function checkQuiz(a,c){
 const r=document.getElementById("quizResult");
 if(a===c){
  r.innerHTML="<h3 style='color:green'>⭕ 正解！ सही उत्तर!</h3>";
 }else{
  r.innerHTML="<h3 style='color:red'>❌ もう一度！ फेरि प्रयास गर्नुहोस्।</h3>";
 }
}

render();
</script>
